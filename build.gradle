plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'java'
    id 'idea'
}

// Axiom ships the official addon API as a nested jar
// (META-INF/jars/axiomclientapi.jar). It is extracted into libs/ at
// configuration time so Loom remaps it like any fileTree dependency.
def axiomJar = file("libs/Axiom-${project.axiom_version}-for-MC${project.minecraft_version}.jar")
def axiomApi = file("libs/axiomclientapi.jar")
println "libs/ contains: ${fileTree(dir: 'libs', include: ['*.jar']).files*.name}"
if (!axiomJar.exists()) {
    println "MISSING ${axiomJar.name}: Axiom must be downloaded into libs/ before compiling"
}
if (axiomJar.exists() && !axiomApi.exists()) {
    def tmp = layout.buildDirectory.dir("axiom-nested").get().asFile
    delete(tmp)
    mkdir(tmp)
    copy {
        from(zipTree(axiomJar)) {
            include "META-INF/jars/*axiomclientapi*.jar"
        }
        into tmp
    }
    def nested = fileTree(tmp) {
        include "**/*.jar"
    }.files.find { it.name.contains("axiomclientapi") }
    if (nested != null) {
        copy {
            from nested
            into "libs"
            rename { "axiomclientapi.jar" }
        }
        println "axiomclientapi extracted from ${axiomJar.name} -> libs/axiomclientapi.jar"
    } else {
        println "WARNING: axiomclientapi not found in ${axiomJar.name}"
    }
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft         "com.mojang:minecraft:${minecraft_version}"
    mappings           loom.officialMojangMappings()

    modImplementation  "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation  "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly fileTree(dir: 'libs', include: ['*.jar'])

}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release   = 21
}

processResources {
    inputs.property 'version', project.mod_version
    filesMatching('fabric.mod.json') {
        expand version: project.mod_version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${archives_base_name}" }
    }
}

// Java/simulator parity: replays the real mod pipeline on
// sim/parity/scenes.txt and requires a block-for-block identical final world.
// Run with ./gradlew parityCheck; any divergence fails.
tasks.register('parityCheck', JavaExec) {
    group = 'verification'
    description = 'Java/simulator parity: real mod pipeline vs auto-validated scenes'
    // scenes.txt is untracked and regenerated by sim/parity_export.py (the CI
    // parity job does it first). Without it the task is skipped rather than
    // failing, so a fresh clone can build.
    onlyIf { file('sim/parity/scenes.txt').exists() }
    dependsOn 'classes'
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'com.bte.railpathtool.dev.ParityHarness'
    args('sim/parity/scenes.txt')
    workingDir = rootProject.projectDir
    if (project.hasProperty('parityDebugScene')) {
        systemProperty 'parity.debugScene', project.property('parityDebugScene')
    }

}
// Parity is part of the check gate: a build whose Java pipeline diverges from
// the validated simulator cannot be released.
check.dependsOn tasks.named('parityCheck')
