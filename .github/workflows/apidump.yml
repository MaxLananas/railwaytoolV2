name: API dump

on:
  push:
    paths:
      - '.github/workflows/apidump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download Axiom and extract the addon API
        run: |
          mkdir -p libs build/api
          curl -L --retry 3 --retry-delay 5 --fail \
            -o "libs/Axiom-5.4.2-for-MC1.21.10.jar" \
            "https://cdn.modrinth.com/data/N6n5dqoA/versions/65TQdBZB/Axiom-5.4.2-for-MC1.21.10.jar"
          cd build/api
          unzip -o -j ../../libs/Axiom-5.4.2-for-MC1.21.10.jar "META-INF/jars/*axiomclientapi*" >/dev/null
          ls -l

      - name: Dump signatures
        run: |
          API=$(ls build/api/*.jar | head -1)
          mkdir -p docs/ci
          {
            echo "== jar =="
            echo "$API"
            echo
            echo "== entries =="
            unzip -l "$API" | awk 'NR>3 {print $4}' | grep -E '\.class$' | sed 's|/|.|g; s|\.class$||' | sort
            echo
            echo "== signatures =="
            for c in $(unzip -l "$API" | awk 'NR>3 {print $4}' | grep -E '\.class$' | sed 's|/|.|g; s|\.class$||' | sort); do
              echo "### $c"
              javap -classpath "$API" -p "$c" 2>&1
              echo
            done
          } > docs/ci/axiom-api.txt
          wc -l docs/ci/axiom-api.txt

      - name: Publish the dump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f docs/ci/axiom-api.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: axiom api dump [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
              if git push; then break; fi
              sleep 5
            done
          fi
