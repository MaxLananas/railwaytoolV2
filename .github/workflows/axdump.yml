name: Axiom config dump

on:
  push:
    paths:
      - '.github/workflows/axdump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore the client cache
        uses: actions/cache@v4
        with:
          path: run-mc
          key: mc-${{ runner.os }}-1.21.10-fabric-0.19.3-v1

      - name: Dump
        run: |
          mkdir -p docs/ci
          {
            echo "== axiom.json =="
            cat run-mc/config/axiom/axiom.json 2>/dev/null || echo "missing"
            echo
            echo "== imgui.ini =="
            cat run-mc/config/axiom/imgui.ini 2>/dev/null || echo "missing"
          } > docs/ci/axiom-config.txt
          wc -l docs/ci/axiom-config.txt

      - name: Publish
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f docs/ci/axiom-config.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: axiom config dump [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
              if git push; then break; fi
              sleep 5
            done
          fi
