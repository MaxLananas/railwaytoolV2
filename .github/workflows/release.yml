name: Release

# Publishes the jar from a chosen commit. `build.yml` releases on `main` only;
# this job is the manual path, and it refuses to run without release notes.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  AXIOM_VERSION: 5.4.2
  AXIOM_JAR: Axiom-5.4.2-for-MC1.21.10.jar
  AXIOM_URL: https://cdn.modrinth.com/data/N6n5dqoA/versions/65TQdBZB/Axiom-5.4.2-for-MC1.21.10.jar

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          MC=$(grep '^minecraft_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          if [ -z "$VERSION" ] || [ -z "$MC" ]; then
            echo "gradle.properties is missing mod_version or minecraft_version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "mc=${MC}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-mc${MC}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "tag ${TAG} already exists; bump mod_version first" >&2
            exit 1
          fi

      - name: Require release notes
        run: |
          python3 tools/changelog_section.py "${{ steps.version.outputs.version }}" \
            --file CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          wc -l "$RUNNER_TEMP/notes.md"

      - name: Download Axiom
        run: |
          mkdir -p libs
          curl -L --retry 3 --retry-delay 5 --fail -o "libs/${AXIOM_JAR}" "${AXIOM_URL}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Check the jar
        run: |
          ls -l build/libs
          test -n "$(ls build/libs/rail-path-tool-*.jar 2>/dev/null | grep -v sources | head -1)"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BTE Rail Path Tool ${{ steps.version.outputs.version }} — MC ${{ steps.version.outputs.mc }}
          body_path: ${{ runner.temp }}/notes.md
          files: build/libs/*[!-dev][!-sources].jar
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
