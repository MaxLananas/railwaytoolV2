name: In-game test

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ingame_driver.py'
      - '.github/workflows/ingame.yml'
      - 'src/main/java/**'
      - 'src/main/resources/**'

permissions:
  contents: write

concurrency:
  group: ingame-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Real client (Xvfb + llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install virtual display and automation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool imagemagick tesseract-ocr \
            libgl1-mesa-dri libglx-mesa0 mesa-utils \
            libxi6 libxcursor1 libxrandr2 libxinerama1 libxxf86vm1

      - name: Python dependencies
        run: pip install --break-system-packages minecraft-launcher-lib nbtlib

      - name: Cache Minecraft files
        uses: actions/cache@v4
        with:
          path: run-mc
          key: mc-${{ runner.os }}-1.21.10-fabric-0.19.3-v1

      - name: Download Axiom
        run: |
          mkdir -p libs
          curl -L --retry 3 --retry-delay 5 --fail \
            -o "libs/Axiom-5.4.2-for-MC1.21.10.jar" \
            "https://cdn.modrinth.com/data/N6n5dqoA/versions/65TQdBZB/Axiom-5.4.2-for-MC1.21.10.jar"

      - name: Build mod
        run: |
          mkdir -p ingame
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee ingame/build.log
          ls -l build/libs | tee -a ingame/build.log

      - name: Run client and drive menus
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          sleep 3
          MOD=$(ls build/libs/rail-path-tool-*.jar | grep -v sources | head -1)
          python3 tools/ingame_driver.py \
            --mod "$MOD" --java "$JAVA_HOME/bin/java" \
            --mc-dir run-mc --out ingame 2>&1 | tee ingame/driver-run.log

      - name: Publish evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/ingame
          cp ingame/selftest-result.txt docs/ingame/result.txt || true
          cp ingame/latest.log docs/ingame/latest.log || true
          cp ingame/latest-restart.log docs/ingame/latest-restart.log || true
          cp ingame/selftest-result-restart.txt docs/ingame/result-restart.txt || true
          cp ingame/console-phase1.log docs/ingame/client-console.log || true
          cp ingame/console-phase2.log docs/ingame/client-console-restart.log || true
          cp ingame/driver-run.log docs/ingame/driver.log || true
          cp ingame/heartbeat.txt docs/ingame/heartbeat.txt || true
          grep -E "SELFTEST" ingame/latest.log > docs/ingame/selftest.log || true
          for f in stage-plan-straight stage-built-straight stage-built-nature \
                   stage-built-clutter stage-built-long stage-built-cross \
                   stage-undo-base stage-undo-built stage-undo-restored \
                   stage-undo-rebuilt stage-undo-cleared \
                   stage-undo-accepted stage-undo-restored-late stage-restart-plan \
                   stage-restart-built world; do
            if [ -f "ingame/$f.png" ]; then cp "ingame/$f.png" docs/ingame/; fi
          done
          ls -l docs/ingame
          git add -f docs/ingame
          if ! git diff --cached --quiet; then
            git commit -m "test(ingame): update client evidence [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
              if git push; then break; fi
              sleep 5
            done
          fi
          exit 0

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-report
          path: ingame
          if-no-files-found: warn
