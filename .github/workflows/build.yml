name: Build & Release

on:
  push:
    branches: [main, master, 'arena/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  AXIOM_VERSION: 5.4.2
  AXIOM_JAR: Axiom-5.4.2-for-MC1.21.10.jar
  AXIOM_URL: https://cdn.modrinth.com/data/N6n5dqoA/versions/65TQdBZB/Axiom-5.4.2-for-MC1.21.10.jar

jobs:
  parity:
    name: Java / simulator parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Regenerate parity scenes
        run: PYTHONHASHSEED=0 python3 sim/parity_export.py

      - name: Download Axiom
        run: |
          mkdir -p libs
          curl -L --retry 3 --retry-delay 5 --fail \
            -o "libs/${AXIOM_JAR}" "${AXIOM_URL}"

      - name: Run parity check
        run: |
          chmod +x ./gradlew
          ./gradlew parityCheck --no-daemon --stacktrace

  build:
    name: Build
    needs: parity
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Auto-bump patch version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          CURRENT=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          MAJOR=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}
          MC_VERSION=$(grep '^minecraft_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}-mc${MC_VERSION}"
          while git ls-remote --tags origin "refs/tags/${NEW_TAG}" | grep -q "${NEW_TAG}"; do
            NEW_PATCH=$((NEW_PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            NEW_TAG="v${NEW_VERSION}-mc${MC_VERSION}"
          done
          sed -i "s/^mod_version=.*/mod_version=${NEW_VERSION}/" gradle.properties
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=${CURRENT}" >> "$GITHUB_ENV"

      - name: Commit bumped version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.NEW_VERSION != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet gradle.properties; then
            git add gradle.properties
            git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
            git push
          fi

      - name: Download Axiom
        run: |
          mkdir -p libs
          curl -L --retry 3 --retry-delay 5 --fail \
            -o "libs/${AXIOM_JAR}" "${AXIOM_URL}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          MC_VERSION=$(grep '^minecraft_version' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "mc_version=${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-mc${MC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rail-path-tool-${{ steps.version.outputs.tag }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Check if tag exists
        id: tag_check
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q "${{ steps.version.outputs.tag }}"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: >
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          steps.tag_check.outputs.exists == 'false' &&
          env.NEW_VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'BTE Rail Path Tool ${{ steps.version.outputs.version }} — MC ${{ steps.version.outputs.mc_version }}'
          body: |
            ### BTE Rail Path Tool `${{ steps.version.outputs.version }}`

            Minecraft `${{ steps.version.outputs.mc_version }}` · Fabric · Axiom `${{ env.AXIOM_VERSION }}+`

            Install: place the jar in `mods/` next to Axiom and Fabric API.
          files: build/libs/*[!-dev][!-sources].jar
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
