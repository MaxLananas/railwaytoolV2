name: Axiom UI probe

on:
  push:
    paths:
      - '.github/workflows/axiomui.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Inspect the tool window
        run: |
          mkdir -p libs docs/ci build/probe
          curl -L --retry 3 --retry-delay 5 --fail \
            -o libs/axiom.jar \
            "https://cdn.modrinth.com/data/N6n5dqoA/versions/65TQdBZB/Axiom-5.4.2-for-MC1.21.10.jar"
          {
            echo "== classes mentioning tool/custom =="
            unzip -l libs/axiom.jar | awk '{print $4}' | grep -iE 'tool|custom' | head -200
            echo
            echo "== language keys mentioning tool =="
            for f in $(unzip -l libs/axiom.jar | awk '{print $4}' | grep -E 'lang/en_us\.json$'); do
              echo "--- $f"
              unzip -p libs/axiom.jar "$f" | python3 -m json.tool 2>/dev/null | grep -iE '"' | head -400
            done
            echo
            echo "== full en_us.json =="
            for f in $(unzip -l libs/axiom.jar | awk '{print $4}' | grep -E 'lang/en_us\.json$'); do
              unzip -p libs/axiom.jar "$f"
            done
            echo
            echo "== ToolsWindow =="
            javap -classpath libs/axiom.jar -p -c com.moulberry.axiom.editor.windows.ToolsWindow 2>&1 | head -400
            echo
            echo "== WrappedCustomTool =="
            javap -classpath libs/axiom.jar -p -c 'com.moulberry.axiom.services.ToolRegistryService$WrappedCustomTool' 2>&1 | head -400
            echo
            echo "== ToolRegistryService =="
            javap -classpath libs/axiom.jar -p -c 'com.moulberry.axiom.services.ToolRegistryService' 2>&1 | head -300
            echo
            echo "== TutorialManager =="
            javap -classpath libs/axiom.jar -p -c com.moulberry.axiom.editor.tutorial.TutorialManager 2>&1 | head -300
            echo
            echo "== TutorialStage =="
            javap -classpath libs/axiom.jar -p com.moulberry.axiom.editor.tutorial.TutorialStage 2>&1 | head -60
            echo
            echo "== Tutorial strings =="
            grep -a -o "tutorial[\"a-zA-Z_.: ]\{0,40\}" libs/axiom.jar 2>/dev/null | sort -u | head -40
            echo
            echo "== ToolManager =="
            javap -classpath libs/axiom.jar -p 'com.moulberry.axiom.tools.ToolManager' 2>&1 | head -120
            echo
            echo "== strings: custom tool =="
            mkdir -p build/probe/classes
            cd build/probe/classes && unzip -o -q ../../../libs/axiom.jar '*.class' && cd ../../..
            grep -rl "CustomTool" build/probe/classes | head -40
          } > docs/ci/axiom-ui.txt 2>&1
          wc -l docs/ci/axiom-ui.txt
          grep -iE "custom" docs/ci/axiom-ui.txt | head -40 || true

      - name: Publish
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f docs/ci/axiom-ui.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: axiom ui probe [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
              if git push; then break; fi
              sleep 5
            done
          fi
