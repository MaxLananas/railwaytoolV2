name: Compile

on:
  push:
    branches: ['arena/**']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/compile.yml'

permissions:
  contents: write

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download Axiom
        run: |
          mkdir -p libs
          curl -L --retry 3 --retry-delay 5 --fail \
            -o "libs/Axiom-5.4.2-for-MC1.21.10.jar" \
            "https://cdn.modrinth.com/data/N6n5dqoA/versions/65TQdBZB/Axiom-5.4.2-for-MC1.21.10.jar"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew compileJava --no-daemon 2>&1 | tee /tmp/compile.log

      - name: Publish the log
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/ci
          cp /tmp/compile.log docs/ci/compile.log
          git add -f docs/ci/compile.log
          if ! git diff --cached --quiet; then
            git commit -m "ci: update compile log [skip ci]"
            git push
          fi
